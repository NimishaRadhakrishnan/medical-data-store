services:
  - type: web
    name: sri-nachiya-medicals
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node apps/shop/server.js
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: SNM_DB
        value: "/data/shop.db"
      - key: SNM_BACKUPS
        value: "/data/backups"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
